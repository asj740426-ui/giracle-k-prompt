<style>
  body {
    font-family: 'Inter', sans-serif;
    /* A deep, moody purple for a synthwave/vaporwave feel */
    background-color: #100F1C; 
    color: #D8D3E6; /* A very light lavender for main text */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Custom Scrollbar Styling */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: #100F1C;
  }
  ::-webkit-scrollbar-thumb {
    background: #86347A; /* A deep magenta */
    border-radius: 5px;
    border: 2px solid #100F1C;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #b347a0; /* Brighter magenta on hover */
  }
  
  /* Custom selection color - using a vibrant magenta */
  ::selection {
    background-color: #ff00ff;
    color: #ffffff;
  }
  
  /* New styles for dropdown visibility and appearance */
  option {
    background-color: #181629; /* Dark background for dropdown options */
    color: #D8D3E6;
  }

  select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23D8D3E6%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E');

    background-position: right 0.75rem center;
    background-size: 1.2em;
  }
</style>
